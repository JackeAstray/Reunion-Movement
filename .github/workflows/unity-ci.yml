name: Unity CI

# 说明：
#   - 需要仓库 Secrets: UNITY_LICENSE（GameCI 的 Personal License / Pro 授权文件内容）
#     获取方式见 https://game.ci/docs/github/activation
#   - EditMode 测试里已经包含「架构守卫」三个用例（超大文件 / 缺失 meta / asmdef 依赖方向），
#     所以测试绿灯 = 守卫绿灯，不需要单独一步。
#   - WebGL / Windows 构建默认只在手动触发和 main 分支上跑；Android 只在手动触发，
#     避免每个 PR 都烧构建时长。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_PROJECT_PATH: Unity/Gear

jobs:
  license-check:
    name: Unity License 配置检查
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: 检查 UNITY_LICENSE
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        shell: bash
        run: |
          if [ -z "${UNITY_LICENSE}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 UNITY_LICENSE；Unity 测试/构建 jobs 将跳过。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "UNITY_LICENSE 已配置。"
          fi

  editmode-tests:
    needs: license-check
    if: needs.license-check.outputs.configured == 'true'
    name: EditMode 测试 + 架构守卫
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: Library-${{ runner.os }}-${{ hashFiles('Unity/Gear/Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: 运行 EditMode 测试
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          testMode: editmode
          artifactsPath: editmode-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode 测试
          customParameters: -nographics

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-results
          path: editmode-results
          if-no-files-found: warn

  webgl-build:
    needs: license-check
    name: WebGL 构建
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: needs.license-check.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: Library-WebGL-${{ runner.os }}-${{ hashFiles('Unity/Gear/Packages/packages-lock.json') }}
          restore-keys: |
            Library-WebGL-${{ runner.os }}-
            Library-${{ runner.os }}-

      - name: 构建 WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          targetPlatform: WebGL
          allowDirtyBuild: true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-build
          path: build/WebGL
          if-no-files-found: warn

  windows-build:
    needs: license-check
    name: Windows 构建
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: needs.license-check.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: Library-Windows-${{ runner.os }}-${{ hashFiles('Unity/Gear/Packages/packages-lock.json') }}
          restore-keys: |
            Library-Windows-${{ runner.os }}-
            Library-${{ runner.os }}-

      - name: 构建 Windows
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          targetPlatform: StandaloneWindows64
          allowDirtyBuild: true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build
          path: build/StandaloneWindows64
          if-no-files-found: warn

  android-build:
    needs: license-check
    name: Android 构建（手动）
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: needs.license-check.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 缓存 Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: Library-Android-${{ runner.os }}-${{ hashFiles('Unity/Gear/Packages/packages-lock.json') }}
          restore-keys: |
            Library-Android-${{ runner.os }}-
            Library-${{ runner.os }}-

      - name: 构建 Android（debug APK）
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          targetPlatform: Android
          androidExportType: androidPackage
          allowDirtyBuild: true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: build/Android
          if-no-files-found: warn

  guard-only:
    name: 架构守卫（不跑 Unity 的快速检查）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: 缺少 .meta 的源文件
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r f; do
            if [ ! -f "$f.meta" ]; then
              echo "::error file=$f::缺少 .meta（移动/新建文件时必须一起提交）"
              missing=1
            fi
          done < <(find Unity/Gear/Assets/Gear \( -name '*.cs' -o -name '*.asmdef' \) -type f)
          exit $missing

      - name: 单文件行数（新文件不得超过 600 行）
        run: |
          set -euo pipefail
          cd Unity/Gear
          baseline="Assets/Gear/Editor/Toolbox/Guards/file-size-baseline.txt"
          fail=0
          while IFS= read -r f; do
            case "$f" in
              */Plugins/*|*/ThirdParty/*|*/3rd/*|*/GenerateScript/*|*/Examples/*|*/Samples/*) continue ;;
            esac
            # 与 ArchitectureGuard.CheckFileSizes 同口径（File.ReadAllLines 行数）。
            # 不能用 wc -l：末行没有换行符时会少算 1 行，CI 与编辑器守卫会得出不同结论。
            lines=$(awk 'END{print NR}' "$f")
            allowed=$(awk -v p="$f" '$2==p {print $1}' "$baseline")
            if [ -n "$allowed" ]; then
              if [ "$lines" -gt "$allowed" ]; then
                echo "::error file=$f::$lines 行，超过基线 $allowed 行（基线只允许变小）"
                fail=1
              fi
            elif [ "$lines" -gt 600 ]; then
              echo "::error file=$f::$lines 行，超过 600 行且未登记基线"
              fail=1
            fi
          done < <(find Assets/Gear -name '*.cs' -type f)
          exit $fail

      - name: asmdef 依赖方向
        run: |
          set -euo pipefail
          fail=0
          check() {
            asmdef="$1"; layer="$2"; shift 2
            [ -f "$asmdef" ] || return 0
            for bad in "$@"; do
              if grep -q "\"$bad\"" "$asmdef"; then
                echo "::error file=$asmdef::$layer 不应引用上层程序集 $bad"
                fail=1
              fi
            done
          }
          base=Unity/Gear/Assets/Gear
          check "$base/Framework/Base/Gear.Base.asmdef" "Gear.Base" Gear.Common Gear.Framework.Modules Gear.Utilities Gear.Framework.Runtime
          check "$base/Common/Gear.Common.asmdef" "Gear.Common" Gear.Framework.Modules Gear.Utilities Gear.Framework.Runtime
          check "$base/Framework/Modules/Gear.Framework.Modules.asmdef" "Gear.Framework.Modules" Gear.Framework.Runtime
          check "$base/Utilities/Gear.Utilities.asmdef" "Gear.Utilities" Gear.Framework.Modules Gear.Framework.Runtime
          check "$base/Framework/Runtime/Gear.Framework.Runtime.asmdef" "Gear.Framework.Runtime" Gear.EditorTools Gear.Toolbox.Editor Gear.Tests
          exit $fail

      - name: .Instance 使用点只减不增
        run: |
          set -euo pipefail
          cd Unity/Gear
          baseline="Assets/Gear/Editor/Toolbox/Guards/instance-usage-baseline.txt"
          fail=0
          while read -r name limit; do
            case "$name" in ''|\#*) continue ;; esac
            actual=$(grep -rho --include='*.cs' --exclude-dir=Plugins --exclude-dir=3rd \
                       --exclude-dir=GenerateScript --exclude-dir=Examples --exclude-dir=Samples \
                       "\\b${name}\\.Instance\\b" Assets/Gear 2>/dev/null | wc -l | tr -d ' \r')
            if [ -z "$actual" ] || [ -z "$limit" ]; then
              echo "::error::基线行解析失败：name=[$name] actual=[$actual] limit=[$limit]"
              fail=1
              continue
            fi
            if [ "$actual" -gt "$limit" ]; then
              echo "::error::$name.Instance 有 $actual 处，超过基线 $limit 处（运行时请改用 Modules.Get<T>()）"
              fail=1
            elif [ "$actual" -lt "$limit" ]; then
              echo "::notice::$name.Instance 已降到 $actual 处（基线 $limit），可下调基线条目"
            fi
          done < <(tr -d '\r' < "$baseline")
          exit $fail

      - name: ICustomSystem 必须声明 ModuleOrder
        run: |
          set -euo pipefail
          cd Unity/Gear
          fail=0
          while IFS= read -r f; do
            case "$f" in */Tests/*|*/Editor/*|*ModuleOrderAttribute.cs) continue ;; esac
            if perl -0777 -ne 'exit(/class\s+\w+\s*:\s*[^{]{0,400}?ICustomSystem/s ? 0 : 1)' "$f"; then
              if ! grep -q '\[ModuleOrder(' "$f"; then
                echo "::error file=$f::实现 ICustomSystem 却没有 [ModuleOrder]，初始化顺序会退化成书写顺序"
                fail=1
              fi
            fi
          done < <(find Assets/Gear -name '*.cs' -type f)
          exit $fail
